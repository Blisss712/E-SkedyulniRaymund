<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>seed</title>
  </head>
  <body>
    <p id="status">seeding…</p>
    <script>
      // Temporary verification page. Writes a fake (unsigned) Supabase session so
      // the app's restored-session path can be exercised in a real browser. The
      // token is not valid, so every REST call the app makes is rejected with 401
      // and nothing is written to the database.
      const params = new URLSearchParams(location.search)
      const fresh = params.get("fresh") !== "0"
      const now = Date.now()
      const created = new Date(fresh ? now - 5000 : now - 30 * 24 * 3600 * 1000).toISOString()
      const last = new Date(fresh ? now - 4000 : now - 29 * 24 * 3600 * 1000).toISOString()

      const session = {
        access_token: "fake." + btoa(JSON.stringify({ exp: Math.floor(now / 1000) + 86400 })),
        refresh_token: "fake-refresh-token",
        token_type: "bearer",
        expires_in: 3600,
        expires_at: Math.floor(now / 1000) + 30 * 24 * 3600,
        user: {
          id: "00000000-0000-4000-8000-000000000001",
          aud: "authenticated",
          role: "authenticated",
          email: "raymund.test@example.com",
          email_confirmed_at: created,
          confirmed_at: created,
          phone: "",
          last_sign_in_at: last,
          app_metadata: { provider: "google", providers: ["google"] },
          user_metadata: {
            full_name: "Raymund Dela Cruz",
            name: "Raymund Dela Cruz",
            onboarded: false,
          },
          identities: [],
          created_at: created,
          updated_at: created,
          is_anonymous: false,
        },
      }

      localStorage.setItem(
        "sb-tbwabyzdojrvhcdyxrib-auth-token",
        JSON.stringify(session),
      )
      document.getElementById("status").textContent =
        "seeded " + (fresh ? "fresh" : "returning") + " " + created
    </script>
  </body>
</html>
